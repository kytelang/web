<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Kyte mark: a diamond built from a 3x3 grid of rounded squares (purple to blue diagonal),
       with a short tail of small teal squares trailing from the lower vertex. -->
  <defs>
    <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="16" y1="96" x2="112" y2="4"
                    gradientTransform="rotate(-45 64 50)">
      <stop offset="0" stop-color="#7B2FF7"/>
      <stop offset="0.5" stop-color="#4F5BE8"/>
      <stop offset="1" stop-color="#2FA8F0"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
  </defs>
  <g transform="rotate(45 64 50)" fill="url(#body)">
    <rect x="31.5" y="17.5" width="19" height="19" rx="4.5"/>
    <rect x="54.5" y="17.5" width="19" height="19" rx="4.5"/>
    <rect x="77.5" y="17.5" width="19" height="19" rx="4.5"/>
    <rect x="31.5" y="40.5" width="19" height="19" rx="4.5"/>
    <rect x="54.5" y="40.5" width="19" height="19" rx="4.5"/>
    <rect x="77.5" y="40.5" width="19" height="19" rx="4.5"/>
    <rect x="31.5" y="63.5" width="19" height="19" rx="4.5"/>
    <rect x="54.5" y="63.5" width="19" height="19" rx="4.5"/>
    <rect x="77.5" y="63.5" width="19" height="19" rx="4.5"/>
  </g>
  <g fill="url(#tail)">
    <rect x="51.5" y="97.5" width="13" height="13" rx="3" transform="rotate(45 58 104)"/>
    <rect x="41.5" y="108.5" width="11" height="11" rx="2.6" transform="rotate(45 47 114)"/>
    <rect x="33.75" y="118.75" width="8.5" height="8.5" rx="2.2" transform="rotate(45 38 123)"/>
  </g>
</svg>
